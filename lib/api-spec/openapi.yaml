openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trades
    description: MetaTrader 5 trade ingestion and strategy performance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /trades:
    post:
      operationId: ingestTrades
      tags: [trades]
      summary: Ingest trade history from an MT5 Expert Advisor
      description: Accepts closed trades. Trades are grouped by magic_number; profit, commission, and swap are combined into net profit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeBatchInput"
      responses:
        "200":
          description: Trade batch accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeIngestResult"
        "400":
          description: Invalid trade payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearTrades
      tags: [trades]
      summary: Delete all stored MT5 trade history
      description: Permanently deletes trades from every account. Other database tables are not affected.
      responses:
        "200":
          description: Trade history cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearTradesResult"
  /trades/dashboard:
    get:
      operationId: getTradesDashboard
      tags: [trades]
      summary: Get account and per-magic-number trading performance
      responses:
        "200":
          description: Performance metrics and cumulative equity series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeDashboard"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    TradeBatchInput:
      type: object
      properties:
        account_id:
          type: string
          maxLength: 120
          description: Optional MT5 account identifier for ticket deduplication.
        trades:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/Mt5TradeInput"
      required: [trades]
    Mt5TradeInput:
      type: object
      properties:
        ticket:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: integer
              minimum: 0
          description: Optional closed-trade ticket; repeated tickets are safely ignored per account.
        magic_number:
          type: integer
        symbol:
          type: string
          maxLength: 40
        type:
          type: string
          maxLength: 40
        volume:
          type: number
          minimum: 0
        open_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        profit:
          type: number
          description: Gross realized profit before commission and swap.
        commission:
          type: number
          default: 0
        swap:
          type: number
          default: 0
        comment:
          type: string
          maxLength: 500
      required: [magic_number, close_time, profit]
    TradeIngestResult:
      type: object
      properties:
        received:
          type: integer
        inserted:
          type: integer
        duplicates:
          type: integer
      required: [received, inserted, duplicates]
    ClearTradesResult:
      type: object
      properties:
        cleared:
          type: boolean
      required: [cleared]
    DashboardTotals:
      type: object
      properties:
        netProfit:
          type: number
        profitFactor:
          type: [number, "null"]
        winRate:
          type: number
        maxDrawdown:
          type: number
        sharpeRatio:
          type: [number, "null"]
        payoutRatio:
          type: [number, "null"]
        tradeCount:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        magicNumberCount:
          type: integer
      required: [netProfit, profitFactor, winRate, maxDrawdown, sharpeRatio, payoutRatio, tradeCount, wins, losses, magicNumberCount]
    EquityPoint:
      type: object
      properties:
        closeTime:
          type: string
          format: date-time
        netProfit:
          type: number
        cumulativeProfit:
          type: number
      required: [closeTime, netProfit, cumulativeProfit]
    StrategyPerformance:
      type: object
      properties:
        magicNumber:
          type: integer
        netProfit:
          type: number
        profitFactor:
          type: [number, "null"]
        winRate:
          type: number
        maxDrawdown:
          type: number
        sharpeRatio:
          type: [number, "null"]
        payoutRatio:
          type: [number, "null"]
        tradeCount:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        breakeven:
          type: integer
        equity:
          type: array
          items:
            $ref: "#/components/schemas/EquityPoint"
      required: [magicNumber, netProfit, profitFactor, winRate, maxDrawdown, sharpeRatio, payoutRatio, tradeCount, wins, losses, breakeven, equity]
    TradeDashboard:
      type: object
      properties:
        totals:
          $ref: "#/components/schemas/DashboardTotals"
        strategies:
          type: array
          items:
            $ref: "#/components/schemas/StrategyPerformance"
        latestTradeAt:
          type: [string, "null"]
          format: date-time
      required: [totals, strategies, latestTradeAt]

